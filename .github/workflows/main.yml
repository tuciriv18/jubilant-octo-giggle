name: macOS Remote Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-rdp:
    runs-on: macos-15-intel
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. Basic macOS information
      # ============================================================
      - name: Show macOS information
        run: |
          echo "=========================================="
          echo "          macOS REMOTE DESKTOP"
          echo "=========================================="

          echo "macOS:"
          sw_vers

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "Current user:"
          whoami

          echo
          echo "Console user:"
          stat -f '%Su' /dev/console || true


      # ============================================================
      # 2. Create remote desktop user
      # ============================================================
      - name: Create remote desktop user
        env:
          RUN_PASSWORD: ${{ secrets.RUN_PASSWORD }}
        run: |
          set -e

          if id run >/dev/null 2>&1; then
            echo "User 'run' already exists."
          else
            echo "Creating user 'run'..."

            sudo sysadminctl \
              -addUser run \
              -fullName "Remote Desktop User" \
              -password "$RUN_PASSWORD"
          fi

          sudo dseditgroup -o edit -a run -t user admin || true

          echo
          echo "User information:"
          id run


      # ============================================================
      # 3. Locate Apple's Remote Management kickstart utility
      # ============================================================
      - name: Locate Apple Remote Management tools
        run: |
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          if [ -x "$KICKSTART" ]; then
            echo "kickstart found:"
            echo "$KICKSTART"
          else
            echo "ERROR: kickstart was not found."
            exit 1
          fi


      # ============================================================
      # 4. Configure Remote Management
      # ============================================================
      - name: Configure Remote Management
        env:
          RUN_PASSWORD: ${{ secrets.RUN_PASSWORD }}
        run: |
          set +e

          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          echo "=========================================="
          echo "     CONFIGURING REMOTE MANAGEMENT"
          echo "=========================================="

          sudo "$KICKSTART" \
            -activate \
            -configure \
            -access -on \
            -users run \
            -privs -all \
            -restart \
            -agent

          echo
          echo "Remote Management configuration command completed."

          sudo "$KICKSTART" \
            -configure \
            -access -on \
            -users run \
            -privs -all

          echo
          echo "Remote Management status:"
          sudo "$KICKSTART" -configure -getstatus


      # ============================================================
      # 5. IMPORTANT:
      #    Configure legacy VNC authentication
      #
      #    VNC_PASSWORD MUST be 8 characters or fewer.
      # ============================================================
      - name: Configure legacy VNC authentication
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set +e

          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          echo "=========================================="
          echo "       CONFIGURING VNC AUTHENTICATION"
          echo "=========================================="

          if [ -z "$VNC_PASSWORD" ]; then
            echo
            echo "ERROR: VNC_PASSWORD GitHub secret is empty."
            echo
            echo "Create a GitHub Actions secret named:"
            echo "VNC_PASSWORD"
            echo
            echo "Use an ASCII VNC password of 8 characters or fewer."
            exit 1
          fi

          VNC_LENGTH=$(printf "%s" "$VNC_PASSWORD" | wc -c | tr -d ' ')

          echo "VNC password length: ${VNC_LENGTH}"

          if [ "$VNC_LENGTH" -gt 8 ]; then
            echo
            echo "ERROR: VNC_PASSWORD is longer than 8 characters."
            echo "Use 8 characters or fewer."
            exit 1
          fi

          echo
          echo "Enabling legacy VNC connections..."

          sudo "$KICKSTART" \
            -configure \
            -clientopts \
            -setvnclegacy \
            -vnclegacy yes

          echo
          echo "Setting VNC password..."

          sudo "$KICKSTART" \
            -configure \
            -clientopts \
            -setvncpw \
            -vncpw "$VNC_PASSWORD"

          echo
          echo "VNC authentication configuration commands completed."


      # ============================================================
      # 6. Restart Apple Remote Management agent
      # ============================================================
      - name: Restart Remote Management agent
        run: |
          set +e

          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          echo "Restarting ARDAgent..."

          sudo "$KICKSTART" \
            -restart \
            -agent

          sleep 5

          echo
          echo "ARDAgent processes:"
          ps aux | grep -i '[A]RDAgent' || true

          echo
          echo "Screen Sharing processes:"
          ps aux | grep -i '[S]creenSharing' || true


      # ============================================================
      # 7. Install / connect Tailscale
      # ============================================================
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          version: latest


      # ============================================================
      # 8. Get Tailscale IP
      # ============================================================
      - name: Get Tailscale address
        id: tailscale_ip
        run: |
          set -e

          echo "=========================================="
          echo "           TAILSCALE INFORMATION"
          echo "=========================================="

          tailscale status || true

          echo
          echo "Tailscale IPv4 addresses:"

          TAILSCALE_IP=$(tailscale ip -4 | head -n 1)

          if [ -z "$TAILSCALE_IP" ]; then
            echo "ERROR: Could not obtain Tailscale IPv4 address."
            exit 1
          fi

          echo "$TAILSCALE_IP"

          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_OUTPUT"

          echo
          echo "Tailscale IPv4:"
          echo "$TAILSCALE_IP"


      # ============================================================
      # 9. Wait for Screen Sharing / VNC listener
      # ============================================================
      - name: Wait for VNC service
        run: |
          set +e

          echo "=========================================="
          echo "             VNC SERVICE TEST"
          echo "=========================================="

          for i in {1..12}; do

            echo
            echo "Attempt $i / 12"

            if nc -z -w 3 127.0.0.1 5900; then
              echo "TCP 5900 is OPEN."
              break
            else
              echo "TCP 5900 is not ready yet."
            fi

            sleep 5
          done

          echo
          echo "Port 5900:"
          lsof -nP -iTCP:5900 -sTCP:LISTEN || true


      # ============================================================
      # 10. Test the actual VNC protocol handshake
      # ============================================================
      - name: Test VNC protocol handshake
        run: |
          set +e

          echo "=========================================="
          echo "          VNC PROTOCOL HANDSHAKE"
          echo "=========================================="

          echo
          echo "Connecting to localhost:5900..."

          RESULT=$(nc -v -w 5 127.0.0.1 5900 </dev/null 2>&1)

          echo "$RESULT"

          echo
          echo "Attempting to read VNC banner..."

          (
            sleep 1
          ) | nc -v -w 5 127.0.0.1 5900 2>&1 | head -c 64 | od -An -tx1c || true

          echo
          echo "Handshake test completed."


      # ============================================================
      # 11. Full Screen Sharing diagnostics
      # ============================================================
      - name: Screen Sharing diagnostics
        env:
          TAILSCALE_IP: ${{ steps.tailscale_ip.outputs.TAILSCALE_IP }}
        run: |
          echo
          echo "=========================================="
          echo "       SCREEN SHARING DIAGNOSTICS"
          echo "=========================================="

          echo
          echo "----- Port 5900 -----"
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || true

          echo
          echo "----- Port 3283 -----"
          sudo lsof -nP -iTCP:3283 -sTCP:LISTEN || true

          echo
          echo "----- Remote Desktop processes -----"
          ps aux | grep -Ei \
            '[A]RDAgent|[S]creenSharing|[S]creenSharingSubscriber|[r]emotemanagementd' \
            || true

          echo
          echo "----- Remote Management launch services -----"
          launchctl list | grep -Ei \
            'Remote|remote|screen|Screen|ARD|ard' \
            || true

          echo
          echo "----- Network interfaces -----"
          ifconfig

          echo
          echo "----- Tailscale IP -----"
          echo "$TAILSCALE_IP"

          echo
          echo "----- Test localhost:5900 -----"
          nc -zv -w 5 127.0.0.1 5900 || true

          echo
          echo "----- Test Tailscale IP:5900 -----"
          nc -zv -w 5 "$TAILSCALE_IP" 5900 || true


      # ============================================================
      # 12. Print connection information
      # ============================================================
      - name: Print connection information
        env:
          TAILSCALE_IP: ${{ steps.tailscale_ip.outputs.TAILSCALE_IP }}
        run: |
          echo
          echo "============================================================"
          echo "                 REMOTE MAC INFORMATION"
          echo "============================================================"
          echo
          echo "VNC address:"
          echo
          echo "    $TAILSCALE_IP:5900"
          echo
          echo "Use your VNC client with:"
          echo
          echo "    Server: $TAILSCALE_IP"
          echo "    Port:   5900"
          echo
          echo "VNC authentication:"
          echo "    Password = GitHub secret VNC_PASSWORD"
          echo
          echo "Remote desktop account:"
          echo "    Username: run"
          echo "    Password: GitHub secret RUN_PASSWORD"
          echo
          echo "============================================================"
          echo
          echo "IMPORTANT:"
          echo "VNC_PASSWORD is separate from RUN_PASSWORD."
          echo "============================================================"


      # ============================================================
      # 13. Keep GitHub macOS runner alive
      # ============================================================
      - name: Keep Mac online
        run: |
          echo
          echo "=========================================="
          echo "       MAC IS READY FOR REMOTE ACCESS"
          echo "=========================================="
          echo
          echo "The GitHub-hosted Mac will remain running"
          echo "until the workflow timeout is reached."
          echo

          while true; do
            echo "[$(date)] Mac remote desktop still running..."
            sleep 60
          done
