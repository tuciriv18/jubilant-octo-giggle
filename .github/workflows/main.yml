name: Linux Build

on:
  workflow_dispatch:

jobs:
  secure-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # INSTALL CINNAMON + XRDP
      # ============================================================
      - name: Install Cinnamon Desktop and XRDP
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cinnamon-desktop-environment \
            cinnamon-session \
            xrdp \
            xorgxrdp \
            dbus-x11

          echo "===== Installed Cinnamon ====="
          cinnamon-session --version || true

          echo "===== Available X Sessions ====="
          ls -la /usr/share/xsessions/ || true


      # ============================================================
      # CREATE USER
      # ============================================================
      - name: Create User with Secret Password
        env:
          RUN_PASSWORD: ${{ secrets.RUN_PASSWORD }}
        run: |
          if [ -z "$RUN_PASSWORD" ]; then
            echo "::error::RUN_PASSWORD secret is not set."
            echo "Add it under:"
            echo "Repository Settings > Secrets and variables > Actions"
            exit 1
          fi

          sudo useradd -m -s /bin/bash run

          echo "run:$RUN_PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo run

          echo "User created successfully."


      # ============================================================
      # CONFIGURE CINNAMON + XRDP
      # ============================================================
      - name: Configure Cinnamon XRDP Session
        run: |

          echo "===== Cinnamon session files ====="
          ls -la /usr/share/xsessions/ || true

          echo "===== Cinnamon executables ====="
          command -v cinnamon-session || true
          command -v cinnamon || true


          # --------------------------------------------------------
          # User session
          # --------------------------------------------------------
          sudo tee /home/run/.xsession > /dev/null <<'EOF'
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_CURRENT_DESKTOP=X-Cinnamon
          export XDG_SESSION_DESKTOP=cinnamon

          exec /usr/bin/cinnamon-session
          EOF

          sudo chown run:run /home/run/.xsession
          sudo chmod 755 /home/run/.xsession


          # --------------------------------------------------------
          # XRDP startup script
          # --------------------------------------------------------
          sudo cp /etc/xrdp/startwm.sh \
            /etc/xrdp/startwm.sh.backup

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          if [ -r /etc/profile ]; then
              . /etc/profile
          fi

          if [ -r "$HOME/.profile" ]; then
              . "$HOME/.profile"
          fi

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_CURRENT_DESKTOP=X-Cinnamon
          export XDG_SESSION_DESKTOP=cinnamon

          export XDG_CONFIG_DIRS=/etc/xdg/xdg-cinnamon:/etc/xdg:$XDG_CONFIG_DIRS

          exec /usr/bin/cinnamon-session
          EOF

          sudo chmod 755 /etc/xrdp/startwm.sh


          # --------------------------------------------------------
          # XRDP certificate permissions
          # --------------------------------------------------------
          sudo adduser xrdp ssl-cert || true


          # --------------------------------------------------------
          # Restart XRDP
          # --------------------------------------------------------
          sudo systemctl enable xrdp

          sudo systemctl restart xrdp

          sudo systemctl restart xrdp-sesman || true


          # --------------------------------------------------------
          # Show XRDP status
          # --------------------------------------------------------
          echo "===== XRDP STATUS ====="

          sudo systemctl --no-pager status xrdp || true

          echo "===== XRDP LISTENING PORT ====="

          sudo ss -lntp | grep 3389 || true


      # ============================================================
      # CONNECT TAILSCALE
      # ============================================================
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          hostname: gh-runner-${{ github.run_id }}


      # ============================================================
      # GET TAILSCALE IP
      # ============================================================
      - name: Get Tailscale IP
        run: |
          TS_IP=$(tailscale ip -4)

          if [ -z "$TS_IP" ]; then
            echo "::error::Could not get Tailscale IPv4 address."
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

          echo "Tailscale IPv4: $TS_IP"


      # ============================================================
      # FIREWALL
      # ============================================================
      - name: Configure Firewall
        run: |

          sudo ufw allow from 100.64.0.0/10 \
            to any port 3389 \
            proto tcp

          sudo ufw --force enable

          echo "===== FIREWALL ====="
          sudo ufw status verbose


      # ============================================================
      # VERIFY XRDP
      # ============================================================
      - name: Verify RDP Accessibility
        run: |

          echo "Checking RDP on:"
          echo "$TAILSCALE_IP:3389"

          sleep 5

          if timeout 10 bash -c \
            "cat < /dev/null > /dev/tcp/$TAILSCALE_IP/3389" \
            2>/dev/null
          then
            echo "===================================="
            echo "RDP TCP CONNECTION SUCCESSFUL"
            echo "===================================="
          else
            echo "::error::TCP connection to RDP port 3389 failed."

            echo "===== XRDP STATUS ====="
            sudo systemctl --no-pager status xrdp || true

            echo "===== XRDP LOG ====="
            sudo journalctl -u xrdp \
              --no-pager \
              -n 100 || true

            echo "===== XRDP SESMAN LOG ====="
            sudo journalctl -u xrdp-sesman \
              --no-pager \
              -n 100 || true

            exit 1
          fi


      # ============================================================
      # DISPLAY ACCESS INFORMATION
      # ============================================================
      - name: Show Access Information
        run: |

          echo ""
          echo "=========================================="
          echo "          REMOTE DESKTOP ACCESS"
          echo "=========================================="
          echo ""
          echo "Address : $TAILSCALE_IP"
          echo "Port    : 3389"
          echo "Username: run"
          echo "Password: RUN_PASSWORD secret"
          echo "Desktop : Cinnamon"
          echo ""
          echo "Windows Remote Desktop:"
          echo ""
          echo "    $TAILSCALE_IP"
          echo ""
          echo "=========================================="
          echo ""


      # ============================================================
      # KEEP RUNNER ALIVE
      # ============================================================
      - name: Maintain Connection
        run: |

          while true; do
            echo "[$(date)] Cinnamon XRDP runner active..."
            sleep 300
          done
