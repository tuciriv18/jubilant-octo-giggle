name: Remote macOS GUI Session

on: 
  workflow_dispatch:

jobs:
  macos-gui:
    runs-on: macos-15 # Apple Silicon Runner
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Connect to your Tailscale Network
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Step 2: Configure Native User Auth & Display Server
      - name: Setup & Start VNC Server
        run: |
          # 1. 'runner' account ka system password set karein
          sudo sysadminctl -resetPasswordFor runner -newPassword "SecretVNC123"

          # 2. Remote Management ko 'runner' user ke liye full privileges ke saath start karein
          # (Legacy -setvncpassword hata diya gaya hai)
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -users runner -privs -all \
            -restart -agent

          # 3. Virtual display buffer enable karein aur screen ko active state me rakhein
          sudo defaults write /Library/Preferences/com.apple.windowserver.displays DisplayResolutionEnabled -bool true
          caffeinate -dimsu &

      # Step 3: Find the Tailscale IP of this Runner
      - name: Get Tailscale IP
        run: |
          echo "========================================="
          echo "IP Address : $(tailscale ip -4)"
          echo "Username : runner"
          echo "Password : SecretVNC123"
          echo "========================================="

      # Step 4: Keep the workflow alive
      - name: Keep Runner Alive for GUI Access
        run: |
          echo "Runner is waiting for your connection..."
          sleep 1800 # 30 minutes
