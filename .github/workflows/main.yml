name: Remote macOS GUI Session

on:
  workflow_dispatch:

jobs:
  macos-gui:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Connect to Tailscale Network
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          hostname: gh-runner-${{ github.run_id }}

      # Step 2: Configure Password & VNC Server
      - name: Setup & Start VNC Server
        run: |
          # 1. 'runner' user ka system password change karein (bypassing Secure Token)
          sudo dscl . -passwd /Users/runner "SecretVNC123"

          # 2. TigerVNC ke liye direct VNC authentication mode enable karein
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -specifiedvnc -install -vncpasswd "SecretVNC123"

          # 3. Remote Management service restart karein
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -users runner -privs -all \
            -restart -agent

          # 4. Display awake rakhein
          caffeinate -dimsu &

      # Step 3: Display Connection Details
      - name: Get Tailscale IP & Connection Info
        run: |
          TS_IP=$(tailscale ip -4)
          echo ""
          echo "========================================="
          echo " macOS VNC ACCESS INFO"
          echo " Address  : $TS_IP"
          echo " Port     : 5900"
          echo " Username : runner"
          echo " Password : SecretVNC123"
          echo "========================================="
          echo ""

      # Step 4: Maintain Active Session
      - name: Keep Runner Alive for GUI Access
        run: |
          echo "Runner is waiting for VNC connection..."
          while true; do
            echo "[$(date)] Runner active - Connect via VNC to $(tailscale ip -4):5900"
            sleep 300
          done
