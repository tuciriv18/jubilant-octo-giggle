name: macOS Remote Desktop

on:
  workflow_dispatch:

jobs:
  macos-remote:
    runs-on: macos-15-intel
    timeout-minutes: 360

    steps:

      # ============================================================
      # SYSTEM INFORMATION
      # ============================================================
      - name: Show macOS Information
        run: |
          echo "=========================================="
          echo "           macOS RUNNER"
          echo "=========================================="

          sw_vers
          echo ""

          echo "Architecture:"
          uname -m

          echo ""
          echo "Computer:"
          system_profiler SPHardwareDataType | head -30

          echo ""
          echo "=========================================="


      # ============================================================
      # CREATE REMOTE USER
      # ============================================================
      - name: Create Remote Desktop User
        env:
          RUN_PASSWORD: ${{ secrets.RUN_PASSWORD }}
        run: |

          if [ -z "$RUN_PASSWORD" ]; then
            echo "::error::RUN_PASSWORD secret is not set."
            echo ""
            echo "Create this repository secret:"
            echo "Settings > Secrets and variables > Actions"
            echo "RUN_PASSWORD"
            exit 1
          fi

          echo "Creating macOS user..."

          if id run >/dev/null 2>&1; then
            echo "User 'run' already exists."
          else
            sudo sysadminctl \
              -addUser run \
              -fullName "Remote User" \
              -password "$RUN_PASSWORD"
          fi

          sudo dseditgroup -o edit \
            -a run \
            -t user \
            admin

          echo "Remote user created."


      # ============================================================
      # ENABLE MACOS REMOTE MANAGEMENT / SCREEN SHARING
      # ============================================================
      - name: Enable macOS Screen Sharing
        env:
          RUN_PASSWORD: ${{ secrets.RUN_PASSWORD }}
        run: |

          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          if [ ! -x "$KICKSTART" ]; then
            echo "::error::macOS Remote Management kickstart utility not found."
            exit 1
          fi

          echo "Enabling macOS Remote Management..."

          sudo "$KICKSTART" \
            -activate \
            -configure \
            -access -on \
            -clientopts \
            -setvnclegacy -vnclegacy yes \
            -setvncpw \
            -vncpw "$RUN_PASSWORD" \
            -restart \
            -agent \
            -privs -all

          echo "Screen Sharing / VNC configuration completed."


      # ============================================================
      # CONNECT TO TAILSCALE
      # ============================================================
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest
          log-mode: normal


      # ============================================================
      # GET TAILSCALE IP
      # ============================================================
      - name: Get Tailscale IP
        run: |

          sleep 5

          TS_IP=$(tailscale ip -4)

          if [ -z "$TS_IP" ]; then
            echo "::error::Unable to obtain Tailscale IPv4 address."
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "        TAILSCALE CONNECTION"
          echo "=========================================="
          echo "Tailscale IPv4: $TS_IP"
          echo "=========================================="


      # ============================================================
      # CHECK REMOTE MANAGEMENT
      # ============================================================
      - name: Verify Remote Management
        run: |

          echo "Checking Remote Management..."

          sudo launchctl list | grep -i ARD || true

          echo ""
          echo "Checking listening ports..."

          sudo lsof -nP -iTCP -sTCP:LISTEN | \
            grep -E '5900|3283' || true

          echo ""
          echo "Tailscale status:"
          sudo tailscale status || true


      # ============================================================
      # TEST VNC PORT
      # ============================================================
      - name: Verify VNC Port
        run: |

          echo "Checking VNC port 5900..."

          for i in {1..10}; do

            if nc -z -G 3 "$TAILSCALE_IP" 5900 2>/dev/null; then
              echo ""
              echo "=========================================="
              echo "       VNC PORT IS ACCESSIBLE"
              echo "=========================================="
              echo ""
              echo "Tailscale IP:"
              echo "$TAILSCALE_IP"
              echo ""
              echo "VNC:"
              echo "$TAILSCALE_IP:5900"
              echo ""
              echo "=========================================="
              exit 0
            fi

            echo "VNC not ready yet... attempt $i/10"
            sleep 3

          done

          echo ""
          echo "::warning::VNC port could not be verified from the runner itself."
          echo "The macOS Screen Sharing service may still be active."


      # ============================================================
      # DISPLAY ACCESS INFORMATION
      # ============================================================
      - name: Show Remote Desktop Information
        run: |

          echo ""
          echo ""
          echo "================================================"
          echo "              MACOS REMOTE DESKTOP"
          echo "================================================"
          echo ""
          echo "macOS:"
          sw_vers -productVersion
          echo ""
          echo "Architecture:"
          uname -m
          echo ""
          echo "Tailscale IP:"
          echo "$TAILSCALE_IP"
          echo ""
          echo "VNC address:"
          echo "$TAILSCALE_IP:5900"
          echo ""
          echo "Username:"
          echo "run"
          echo ""
          echo "Password:"
          echo "The value stored in RUN_PASSWORD"
          echo ""
          echo "================================================"
          echo ""
          echo "From Windows, use a VNC client and connect to:"
          echo ""
          echo "    $TAILSCALE_IP:5900"
          echo ""
          echo "================================================"


      # ============================================================
      # KEEP MACOS RUNNER ALIVE
      # ============================================================
      - name: Keep macOS Runner Alive
        run: |

          echo ""
          echo "=========================================="
          echo "      MACOS RUNNER IS ACTIVE"
          echo "=========================================="
          echo ""

          while true; do

            echo "[$(date)] macOS remote desktop active."

            sleep 300

          done
