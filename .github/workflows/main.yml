name: Remote macOS GUI Session (RDP)

on:
  workflow_dispatch:

jobs:
  macos-gui:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Connect to Tailscale Network
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          hostname: gh-runner-${{ github.run_id }}

      # Step 2: Bypass Setup Assistant, Setup User & Inject Mouse/Keyboard TCC
      - name: Configure macOS System & Input Permissions
        run: |
          # 1. Create 'vncuser' admin account
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "SecretVNC123" -admin

          # 2. Bypass macOS Setup Assistant modal blocking mouse clicks
          sudo touch /var/db/.AppleSetupDone
          sudo defaults write /Library/Preferences/com.apple.SetupAssistant DidSeeCloudSetup -bool true
          sudo defaults write /Library/Preferences/com.apple.SetupAssistant DidSeeSiriSetup -bool true
          sudo defaults write /Library/Preferences/com.apple.SetupAssistant DidSeePrivacy -bool true
          sudo defaults write /Library/Preferences/com.apple.SetupAssistant DidSeeAccessibility -bool true
          sudo killall "Setup Assistant" 2>/dev/null || true

          # 3. Configure local VNC backend on port 5900
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "SecretVNC123"

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -users vncuser,runner -privs -all \
            -restart -agent

          # 4. Inject TCC permissions for ScreenCapture, Accessibility, and Synthetic Mouse Clicks (PostEvent)
          TCC_DB="/Library/Application Support/com.apple.TCC/TCC.db"
          for SERVICE in "kTCCServiceScreenCapture" "kTCCServiceAccessibility" "kTCCServicePostEvent"; do
            for CLIENT in "com.apple.RemoteDesktopAgent" "com.apple.screensharing.agent" "com.apple.controlcenter"; do
              sudo sqlite3 "$TCC_DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES ('$SERVICE', '$CLIENT', 0, 2, 4, 1);"
            done
          done

          # 5. Enable Auto-login & keep screen awake
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser "vncuser"
          caffeinate -dimsu &

      # Step 3: Install XRDP & Configure RDP-to-VNC Bridge (Port 3389)
      - name: Install & Start XRDP Server
        run: |
          brew install xrdp
          BREW_PREFIX=$(brew --prefix)
          CONF_FILE="$BREW_PREFIX/etc/xrdp/xrdp.ini"

          # Configure XRDP to bridge RDP port 3389 directly to local VNC 5900
          sudo tee "$CONF_FILE" > /dev/null <<'EOF'
          [globals]
          bitmap_cache=true
          bitmap_compression=true
          port=3389
          crypt_level=low
          allow_channels=true

          [macOS-RDP]
          name=macOS-RDP
          lib=libvnc.so
          ip=127.0.0.1
          port=5900
          username=vncuser
          password=SecretVNC123
          EOF

          # Start XRDP daemon on port 3389
          sudo "$BREW_PREFIX/sbin/xrdp" &
          sleep 3

      # Step 4: Display Windows RDP Connection Info
      - name: Get Connection Info for Windows RDP
        run: |
          TS_IP=$(tailscale ip -4)
          echo ""
          echo "========================================="
          echo " ACCESS INFO (mstsc.exe)"
          echo " Computer : $TS_IP"
          echo " Username : vncuser"
          echo " Password : SecretVNC123"
          echo "========================================="
          echo ""

      # Step 5: Keep Runner Alive
      - name: Maintain Connection
        run: |
          echo "Runner ready for RDP connections..."
          while true; do
            echo "[$(date)] Active - Connect via Windows RDP to $(tailscale ip -4)"
            sleep 300
          done
