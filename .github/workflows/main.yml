name: Linux Build

on:
  workflow_dispatch:

jobs:
  secure-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Desktop Environment and XRDP
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            dbus

      - name: Create User
        env:
          RUN_PASSWORD: ${{ secrets.RUN_PASSWORD }}
        shell: bash
        run: |
          set -e

          if [ -z "$RUN_PASSWORD" ]; then
            echo "::error::RUN_PASSWORD secret is not set."
            exit 1
          fi

          if id run >/dev/null 2>&1; then
            echo "User 'run' already exists."
          else
            sudo useradd -m -s /bin/bash run
          fi

          echo "run:$RUN_PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo run

      - name: Configure XFCE and XRDP
        shell: bash
        run: |
          set -eux

          # Clean any previous XFCE session state
          sudo -u run rm -rf /home/run/.cache/sessions
          sudo -u run rm -rf /home/run/.config/xfce4/xfconf

          # Make sure the user's home directory is owned correctly
          sudo chown -R run:run /home/run

          # XFCE session file
          sudo -u run bash -c 'cat > /home/run/.xsession <<EOF
          export XDG_CONFIG_DIRS=/etc/xdg
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          exec dbus-run-session -- startxfce4
          EOF'

          sudo chmod 755 /home/run/.xsession
          sudo chown run:run /home/run/.xsession

          # Explicit XRDP startup
          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_CONFIG_DIRS=/etc/xdg
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce

          if [ -r /etc/profile ]; then
              . /etc/profile
          fi

          if [ -r "$HOME/.profile" ]; then
              . "$HOME/.profile"
          fi

          exec dbus-run-session -- startxfce4
          EOF

          sudo chmod 755 /etc/xrdp/startwm.sh

          # XRDP certificate permissions
          sudo adduser xrdp ssl-cert || true

          # Restart XRDP
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          echo "===== XRDP STATUS ====="
          sudo systemctl --no-pager --full status xrdp || true

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          hostname: gh-runner-${{ github.run_id }}

      - name: Get Tailscale IP
        shell: bash
        run: |
          set -e

          TS_IP=$(tailscale ip -4)

          if [ -z "$TS_IP" ]; then
            echo "::error::Could not obtain Tailscale IPv4 address."
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

          echo "Tailscale IPv4: $TS_IP"

      - name: Verify XRDP
        shell: bash
        run: |
          set -e

          echo "=== XRDP LISTENING ==="
          sudo ss -lntp | grep ':3389' || {
            echo "::error::XRDP is not listening on port 3389."
            sudo journalctl -u xrdp --no-pager -n 100
            exit 1
          }

          echo ""
          echo "=== XRDP SERVICE ==="
          sudo systemctl --no-pager --full status xrdp

          echo ""
          echo "=== XFCE CHECK ==="
          command -v startxfce4
          command -v xfce4-session

      - name: Diagnose XFCE and XRDP
        shell: bash
        run: |
          echo "===== XFCE ====="
          command -v startxfce4 || true
          command -v xfce4-session || true
          command -v xfconfd || true
          command -v dbus-run-session || true

          echo ""
          echo "===== XDG CONFIG ====="
          ls -ld /etc/xdg
          ls -la /etc/xdg | head -50

          echo ""
          echo "===== USER SESSION FILE ====="
          sudo cat /home/run/.xsession

          echo ""
          echo "===== XRDP LISTENING ====="
          sudo ss -lntp | grep 3389 || true

          echo ""
          echo "===== XRDP LOG ====="
          sudo tail -100 /var/log/xrdp.log || true

          echo ""
          echo "===== XRDP SESSION LOG ====="
          sudo tail -150 /var/log/xrdp-sesman.log || true

          echo ""
          echo "===== USER FILES ====="
          sudo ls -la /home/run

      - name: Maintain Connection
        shell: bash
        run: |
          echo ""
          echo "=============================="
          echo "          ACCESS"
          echo "=============================="
          echo "Address: $TAILSCALE_IP"
          echo "Username: run"
          echo "Password: [value stored in RUN_PASSWORD secret]"
          echo "=============================="
          echo ""

          while true; do
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Runner active"
            sleep 300
          done
