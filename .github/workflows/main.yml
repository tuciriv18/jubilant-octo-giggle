name: Remote macOS RDP Session (mstsc.exe)

on:
  workflow_dispatch:

jobs:
  macos-rdp:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Connect to Tailscale Network
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          hostname: gh-runner-${{ github.run_id }}

      # Step 2: Fix DNS Resolution for Safari / Internet
      - name: Fix DNS & Public Network Resolution
        run: |
          SERVICES=$(networksetup -listallnetworkservices | grep -v '\*')
          while read -r SERVICE; do
            if [ -n "$SERVICE" ]; then
              sudo networksetup -setdnsservers "$SERVICE" 1.1.1.1 8.8.8.8 100.100.100.100 || true
            fi
          done <<< "$SERVICES"

      # Step 3: Setup macOS Desktop, User, TCC Permissions & Bypass Setup Assistant
      - name: Setup macOS Desktop & VNC Engine
        run: |
          # 1. Create 'vncuser' admin account
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "SecretVNC123" -admin

          # 2. Bypass macOS Setup Assistant & Software Update popups
          sudo touch /var/db/.AppleSetupDone
          sudo defaults write /Library/Preferences/com.apple.SetupAssistant DidSeeCloudSetup -bool true
          sudo defaults write /Library/Preferences/com.apple.SetupAssistant DidSeeSiriSetup -bool true
          sudo defaults write /Library/Preferences/com.apple.SetupAssistant DidSeePrivacy -bool true
          sudo defaults write /Library/Preferences/com.apple.SetupAssistant DidSeeAccessibility -bool true
          sudo defaults write /Library/Preferences/com.apple.SoftwareUpdate AutomaticDownload -bool false
          
          # Background loop to kill lingering setup windows
          (while true; do sudo killall "Setup Assistant" "SoftwareUpdateNotificationManager" 2>/dev/null; sleep 3; done) &

          # 3. Enable Display Resolutions in macOS WindowServer
          sudo defaults write /Library/Preferences/com.apple.windowserver.displays DisplayResolutionEnabled -bool true

          # 4. Configure VNC password authentication
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "SecretVNC123"

          # 5. Activate ARD Agent with Full Control Privileges
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -users vncuser,runner -privs -all \
            -restart -agent

          # 6. Inject TCC permissions
          TCC_DB="/Library/Application Support/com.apple.TCC/TCC.db"
          for SERVICE in "kTCCServiceScreenCapture" "kTCCServiceAccessibility" "kTCCServicePostEvent"; do
            for CLIENT in "com.apple.RemoteDesktopAgent" "com.apple.screensharing.agent"; do
              sudo sqlite3 "$TCC_DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES ('$SERVICE', '$CLIENT', 0, 2, 4, 1);"
            done
          done

          # 7. Enable Auto-Login & Keep Display Awake
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser "vncuser"
          caffeinate -dimsu &

      # Step 4: Force 1080p Resolution & Build Native XRDP Bridge
      - name: Build & Start Native RDP Server
        run: |
          # 1. Install build dependencies and display resolution utility
          brew install autoconf automake libtool pkg-config libvncserver nasm openssl@3 libx11 libxfixes libxrandr libxkbfile pixman displayplacer

          # 2. Force macOS display resolution to 1920x1080
          displayplacer "res:1920x1080" 2>/dev/null || true

          # 3. Set Homebrew environment variables with embedded rpath
          export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:/opt/homebrew/opt/openssl@3/lib/pkgconfig:/opt/homebrew/opt/libvncserver/lib/pkgconfig:$PKG_CONFIG_PATH"
          export LDFLAGS="-L/opt/homebrew/lib -L/opt/homebrew/opt/openssl@3/lib -Wl,-rpath,/opt/homebrew/lib -Wl,-rpath,/opt/homebrew/opt/openssl@3/lib"
          export CPPFLAGS="-I/opt/homebrew/include -I/opt/homebrew/opt/openssl@3/include"

          # 4. Clone and build xrdp
          git clone --recursive https://github.com/neutrinolabs/xrdp.git
          cd xrdp
          ./bootstrap
          ./configure --enable-vnc --prefix=/usr/local --x-includes=/opt/homebrew/include --x-libraries=/opt/homebrew/lib
          make -j$(sysctl -n hw.ncpu)
          sudo make install

          # 5. Create module symlinks for dyld
          sudo mkdir -p /usr/local/lib/xrdp
          sudo ln -sf /usr/local/lib/xrdp/libvnc.dylib /usr/local/lib/xrdp/libvnc.so 2>/dev/null || true
          sudo ln -sf /usr/local/lib/xrdp/libvnc.dylib /usr/local/lib/xrdp/libxrdp-vnc.so 2>/dev/null || true

          # 6. Create SSL certs
          sudo mkdir -p /etc/xrdp
          sudo openssl req -x509 -newkey rsa:2048 -nodes -keyout /etc/xrdp/key.pem -out /etc/xrdp/cert.pem -days 365 -subj "/CN=macOS-RDP" 2>/dev/null || true

          # 7. Configure xrdp.ini for 1920x1080 canvas & fast networking
          sudo tee /etc/xrdp/xrdp.ini > /dev/null << 'EOF'
          [globals]
          bitmap_cache=true
          bitmap_compression=true
          bulk_compression=true
          max_bpp=24
          new_cursors=true
          use_fastpath=both
          tcp_nodelay=true
          tcp_keepalive=true
          ls_width=1920
          ls_height=1080
          port=3389
          crypt_level=low
          security_layer=rdp

          [macOS-Desktop]
          name=macOS-Desktop
          lib=libvnc.so
          ip=127.0.0.1
          port=5900
          username=vncuser
          password=SecretVNC123
          EOF

          # 8. Start XRDP daemon
          sudo DYLD_LIBRARY_PATH="/opt/homebrew/lib:/opt/homebrew/opt/openssl@3/lib:/usr/local/lib:/usr/local/lib/xrdp" /usr/local/sbin/xrdp &
          sleep 2

      # Step 5: Display Connection Info
      - name: Get Connection Details
        run: |
          TS_IP=$(tailscale ip -4)
          echo ""
          echo "========================================="
          echo " WINDOWS RDP (mstsc.exe) ACCESS INFO"
          echo " Computer : $TS_IP"
          echo " Username : vncuser"
          echo " Password : SecretVNC123"
          echo "========================================="
          echo ""

      # Step 6: Maintain Connection Session
      - name: Keep Runner Alive
        run: |
          echo "Runner is waiting for Windows RDP connection..."
          while true; do
            echo "[$(date)] Runner active - Connect via mstsc.exe to $(tailscale ip -4)"
            sleep 300
          done
