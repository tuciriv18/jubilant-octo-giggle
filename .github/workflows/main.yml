name: Secure Build

on:
  workflow_dispatch:
    inputs:
      ubuntu_latest:
        description: 'Run on ubuntu-latest'
        type: boolean
        default: true
      windows_latest:
        description: 'Run on windows-latest'
        type: boolean
        default: false
      windows_2022:
        description: 'Run on windows-2022'
        type: boolean
        default: false
      windows_11_arm:
        description: 'Run on windows-11-arm'
        type: boolean
        default: false

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.set-runners.outputs.runners }}
    steps:
      - id: set-runners
        run: |
          RUNNERS=()
          if [ "${{ inputs.ubuntu_latest }}" = "true" ]; then RUNNERS+=('"ubuntu-latest"'); fi
          if [ "${{ inputs.windows_latest }}" = "true" ]; then RUNNERS+=('"windows-latest"'); fi
          if [ "${{ inputs.windows_2022 }}" = "true" ]; then RUNNERS+=('"windows-2022"'); fi
          if [ "${{ inputs.windows_11_arm }}" = "true" ]; then RUNNERS+=('"windows-11-arm"'); fi

          if [ ${#RUNNERS[@]} -eq 0 ]; then
            RUNNERS+=('"ubuntu-latest"')
          fi

          JSON_ARRAY="[$(IFS=,; echo "${RUNNERS[*]}")]"
          echo "runners=$JSON_ARRAY" >> "$GITHUB_OUTPUT"

  secure-build:
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix:
        runner_os: ${{ fromJson(needs.prepare-matrix.outputs.runners) }}
    runs-on: ${{ matrix.runner_os }}
    timeout-minutes: 360

    steps:
      # ==========================================
      # LINUX / UBUNTU STEPS
      # ==========================================
      - name: "[Linux] Install Desktop Environment and XRDP"
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies xfce4-session xfconf xrdp xorgxrdp xorg dbus dbus-x11 dbus-user-session

      - name: "[Linux] Create User with added Secret Password"
        if: ${{ runner.os == 'Linux' }}
        env:
          RUN_PASSWORD: ${{ secrets.RUN_PASSWORD }}
        run: |
          if [ -z "$RUN_PASSWORD" ]; then
            echo "::error::RUN_PASSWORD secret is not set. Add it under repo Settings > Secrets and variables > Actions."
            exit 1
          fi

          sudo useradd -m -s /bin/bash run
          echo "run:$RUN_PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo run

      - name: "[Linux] Configure XRDP Session and Firewall"
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo tee /home/run/.xsession > /dev/null <<'EOF'
          #!/bin/sh
          export XDG_CONFIG_DIRS=/etc:/etc/xdg
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_CACHE_HOME="$HOME/.cache"
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          exec /usr/bin/startxfce4
          EOF
          sudo chown run:run /home/run/.xsession
          sudo chmod +x /home/run/.xsession

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          export XDG_CONFIG_DIRS=/etc:/etc/xdg
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce
          if [ -r /etc/profile ]; then . /etc/profile; fi
          if [ -r "$HOME/.profile" ]; then . "$HOME/.profile"; fi
          export XDG_CONFIG_DIRS=/etc:/etc/xdg
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce
          exec "$HOME/.xsession"
          EOF
          sudo chmod 755 /etc/xrdp/startwm.sh

          sudo adduser xrdp ssl-cert
          sudo systemctl enable --now xrdp

          sudo ufw allow from 100.64.0.0/10 to any port 3389 proto tcp
          sudo ufw --force enable

      - name: "[Linux] Connect to Tailscale"
        if: ${{ runner.os == 'Linux' }}
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          hostname: gh-runner-${{ github.run_id }}

      - name: "[Linux] Get Tailscale IP"
        if: ${{ runner.os == 'Linux' }}
        run: |
          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: "[Linux] Verify Accessibility"
        if: ${{ runner.os == 'Linux' }}
        run: |
          echo "Tailscale IP: $TAILSCALE_IP"

          if timeout 5 bash -c "cat < /dev/null > /dev/tcp/$TAILSCALE_IP/3389" 2>/dev/null; then
            echo "TCP connectivity successful!"
          else
            echo "::error::TCP connection to RDP port 3389 failed"
            exit 1
          fi

      - name: "[Linux] Maintain Connection"
        if: ${{ runner.os == 'Linux' }}
        run: |
          echo ""
          echo "=== ACCESS ==="
          echo "Address: $TAILSCALE_IP"
          echo "Username: run"
          echo "Password: (the one you set in the RUN_PASSWORD secret)"
          echo "=================="
          echo ""

          while true; do
            echo ""
            echo "[$(date)] Active - Use Ctrl+C in workflow to terminate"
            echo "----- xrdp-sesman.log (tail) -----"
            sudo tail -n 30 /var/log/xrdp-sesman.log 2>/dev/null || true
            echo "----- .xsession-errors (tail) -----"
            sudo tail -n 30 /home/run/.xsession-errors 2>/dev/null || true
            sleep 20
          done

      # ==========================================
      # WINDOWS STEPS
      # ==========================================
      - name: "[Windows] Configure Core Settings"
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" "fDenyTSConnections" 0;
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" "UserAuthentication" 1;
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" "SecurityLayer" 2;
          netsh advfirewall firewall delete rule name="RDP-Tailscale";
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10;
          Restart-Service TermService -Force;

      - name: "[Windows] Create User with added Secret Password"
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        env:
          RUN_PASSWORD: ${{ secrets.RUN_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:RUN_PASSWORD)) { Write-Error "RUN_PASSWORD secret is not set. Add it under repo Settings > Secrets and variables > Actions."; exit 1; };
          $securePass =$env:RUN_PASSWORD | ConvertTo-SecureString -AsPlainText -Force;
          New-LocalUser "run" -Password $securePass -AccountNeverExpires;
          Add-LocalGroupMember "Administrators" "run";
          Add-LocalGroupMember "Remote Desktop Users" "run";
          if (-not (Get-LocalUser "run")) { Write-Error "User creation failed"; exit 1; };

      - name: "[Windows] Install Tailscale"
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq "ARM64") { "arm64" } else { "amd64" };
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-$arch.msi";
          $installerPath = "$env:TEMP\tailscale.msi";
          (New-Object System.Net.WebClient).DownloadFile($tsUrl,$installerPath);
          Start-Process "msiexec.exe" -ArgumentList "/i `"$installerPath`" /quiet /norestart" -Wait;
          Remove-Item "$installerPath" -Force -ErrorAction SilentlyContinue;
          Start-Service Tailscale -ErrorAction SilentlyContinue;

      - name: "[Windows] Mint short-lived Tailscale auth key (OAuth client)"
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrEmpty($env:TS_OAUTH_CLIENT_ID) -or [string]::IsNullOrEmpty($env:TS_OAUTH_CLIENT_SECRET)) { Write-Error "TS_OAUTH_CLIENT_ID or TS_OAUTH_CLIENT_SECRET is missing under Repo Secrets."; exit 1; };
          $tokenBody = "client_id=" + $env:TS_OAUTH_CLIENT_ID + "&client_secret=" + $env:TS_OAUTH_CLIENT_SECRET;
          $tokenResp = Invoke-RestMethod -Method Post -Uri "https://api.tailscale.com/api/v2/oauth/token" -ContentType "application/x-www-form-urlencoded" -Body $tokenBody;
          Write-Host "::add-mask::$($tokenResp.access_token)";
          $keyBody = '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:ci"]}}},"expirySeconds":3600}';
          $keyResp = Invoke-RestMethod -Method Post -Uri "https://api.tailscale.com/api/v2/tailnet/-/keys" -Headers @{ Authorization = "Bearer $($tokenResp.access_token)" } -ContentType "application/json" -Body $keyBody;
          Write-Host "::add-mask::$($keyResp.key)";
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "TS_AUTHKEY=$($keyResp.key)`n");

      - name: "[Windows] Establish Tailscale Connection"
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe";
          if (-not (Test-Path $tsExe)) { $tsExe = "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"; };
          if (-not (Test-Path $tsExe)) { $tsExe = "$env:ProgramW6432\Tailscale\tailscale.exe"; };
          if (-not (Test-Path $tsExe)) { Write-Error "tailscale.exe not found in standard program directories."; exit 1; };

          Start-Service Tailscale -ErrorAction SilentlyContinue;
          & "$tsExe" up --authkey=$env:TS_AUTHKEY --hostname="gh-runner-$env:GITHUB_RUN_ID" --unattended;

          $tsIP = "";
          $retries = 0;
          while ((-not $tsIP) -and ($retries -lt 12)) { $tsIP = & "$tsExe" ip -4; Start-Sleep -Seconds 5; $retries++; };
          if (-not $tsIP) { Write-Error "Tailscale IP not assigned. Exiting."; exit 1; };
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "TAILSCALE_IP=$tsIP`n");

      - name: "[Windows] Verify Accessibility"
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          $ip = "$env:TAILSCALE_IP";
          Write-Host "Tailscale IP: $ip";
          if ([string]::IsNullOrEmpty($ip)) { Write-Error "TAILSCALE_IP environment variable was not found."; exit 1; };
          try { $client = New-Object System.Net.Sockets.TcpClient; $client.Connect($ip, 3389);$client.Close(); Write-Host "TCP connectivity successful!"; } catch { Write-Error "TCP connection to RDP port 3389 failed: $_"; exit 1; };

      - name: "[Windows] Maintain Connection"
        if: ${{ runner.os == 'Windows' }}
        shell: powershell
        run: |
          Write-Host "";
          Write-Host "=== ACCESS ===";
          Write-Host "Address: $env:TAILSCALE_IP";
          Write-Host "Username: run";
          Write-Host "Password: (the one you set in the RUN_PASSWORD secret)";
          Write-Host "==================";
          Write-Host "";
          while ($true) { Write-Host "[$(Get-Date)] Active - Use Ctrl+C in workflow to terminate"; Start-Sleep -Seconds 300; };
