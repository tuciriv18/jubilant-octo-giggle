- name: Run macOS in Docker (dockurr/macos)
        run: |
          docker run -d --name macos \
            -e VERSION="15" \
            -e RAM_SIZE="12G" \
            -e DISK_SIZE="64G" \
            -e WIDTH="1920" \
            -e HEIGHT="1080" \
            -p 8006:8006 \
            -p 5900:5900 \
            --device=/dev/kvm \
            --device=/dev/net/tun \
            --cap-add NET_ADMIN \
            --stop-timeout 120 \
            dockurr/macos
