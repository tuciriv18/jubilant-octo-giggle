name: Linux Build

on:
  workflow_dispatch:

jobs:
  secure-build:
    runs-on: ubuntu-latest

    # GitHub-hosted runners have a maximum job duration.
    timeout-minutes: 360

    steps:
      # ------------------------------------------------------------
      # Install XFCE + XRDP + Xorg backend + D-Bus
      # ------------------------------------------------------------
      - name: Install Desktop Environment and XRDP
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-session \
            xfce4-settings \
            xfconf \
            xrdp \
            xorgxrdp \
            dbus \
            dbus-x11 \
            dbus-user-session

      # ------------------------------------------------------------
      # Create RDP user
      # ------------------------------------------------------------
      - name: Create RDP User
        shell: bash
        env:
          RUN_PASSWORD: ${{ secrets.RUN_PASSWORD }}
        run: |
          set -e

          if [ -z "$RUN_PASSWORD" ]; then
            echo "::error::RUN_PASSWORD secret is not set."
            echo "Add RUN_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi

          if id run >/dev/null 2>&1; then
            echo "User 'run' already exists."
          else
            sudo useradd -m -s /bin/bash run
          fi

          echo "run:$RUN_PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo run

          sudo chown -R run:run /home/run

      # ------------------------------------------------------------
      # Configure XFCE/XRDP
      # ------------------------------------------------------------
      - name: Configure XFCE and XRDP
        shell: bash
        run: |
          set -eux

          # Make sure required packages are present.
          sudo apt-get install -y \
            xfconf \
            xfce4-session \
            xfce4-settings \
            dbus \
            dbus-x11 \
            dbus-user-session \
            xorgxrdp

          # Remove stale XFCE session information.
          sudo -u run rm -rf /home/run/.cache/sessions
          sudo -u run rm -rf /home/run/.config/xfce4-session

          # --------------------------------------------------------
          # User XFCE session
          # --------------------------------------------------------
          sudo -u run tee /home/run/.xsession > /dev/null <<'EOF'
          export XDG_CONFIG_DIRS=/etc/xdg
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          exec dbus-run-session -- startxfce4
          EOF

          sudo chown run:run /home/run/.xsession
          sudo chmod 755 /home/run/.xsession

          # --------------------------------------------------------
          # XRDP startup
          # --------------------------------------------------------
          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_CONFIG_DIRS=/etc/xdg
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce

          if [ -r /etc/profile ]; then
              . /etc/profile
          fi

          if [ -r "$HOME/.profile" ]; then
              . "$HOME/.profile"
          fi

          exec dbus-run-session -- startxfce4
          EOF

          sudo chmod 755 /etc/xrdp/startwm.sh

          # Allow XRDP to read its TLS certificate.
          sudo adduser xrdp ssl-cert || true

          # Restart XRDP after configuration.
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          echo ""
          echo "===== XRDP STATUS ====="
          sudo systemctl --no-pager --full status xrdp || true

      # ------------------------------------------------------------
      # Connect runner to Tailscale
      # ------------------------------------------------------------
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          hostname: gh-runner-${{ github.run_id }}

      # ------------------------------------------------------------
      # Get Tailscale address
      # ------------------------------------------------------------
      - name: Get Tailscale IP
        shell: bash
        run: |
          set -e

          TS_IP="$(tailscale ip -4)"

          if [ -z "$TS_IP" ]; then
            echo "::error::Could not obtain Tailscale IPv4 address."
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

          echo "Tailscale IP: $TS_IP"

      # ------------------------------------------------------------
      # Configure firewall AFTER Tailscale exists
      # ------------------------------------------------------------
      - name: Configure Firewall
        shell: bash
        run: |
          set -e

          sudo apt-get install -y ufw

          # Allow RDP only from the Tailscale CGNAT range.
          sudo ufw allow from 100.64.0.0/10 \
            to any port 3389 proto tcp

          # Also explicitly allow RDP through the Tailscale interface.
          sudo ufw allow in on tailscale0 \
            to any port 3389 proto tcp

          sudo ufw --force enable

          sudo ufw status verbose

      # ------------------------------------------------------------
      # Verify XRDP
      # ------------------------------------------------------------
      - name: Verify XRDP
        shell: bash
        run: |
          set -e

          echo "===== TAILSCALE ====="
          tailscale status

          echo ""
          echo "===== TAILSCALE IP ====="
          echo "$TAILSCALE_IP"

          echo ""
          echo "===== XRDP LISTENING ====="
          sudo ss -lntp | grep ':3389' || {
            echo "::error::XRDP is not listening on port 3389."
            sudo journalctl -u xrdp --no-pager -n 100
            exit 1
          }

          echo ""
          echo "===== XFCE ====="
          command -v startxfce4
          command -v xfce4-session
          command -v xfconf-query
          command -v dbus-run-session

          echo ""
          echo "===== XRDP SERVICE ====="
          sudo systemctl --no-pager --full status xrdp

      # ------------------------------------------------------------
      # XFCE diagnostics
      # ------------------------------------------------------------
      - name: Diagnose XFCE
        shell: bash
        run: |
          echo "===== XFCONF ====="

          dpkg -L xfconf | grep -E 'xfconfd|xfconf-query' || true

          echo ""
          echo "===== XFCE SESSION ====="

          sudo cat /home/run/.xsession

          echo ""
          echo "===== XDG CONFIG ====="

          ls -ld /etc/xdg
          ls -la /etc/xdg/xfce4 || true

          echo ""
          echo "===== XRDP LOG ====="

          sudo tail -100 /var/log/xrdp.log || true

          echo ""
          echo "===== XRDP SESSION LOG ====="

          sudo tail -150 /var/log/xrdp-sesman.log || true

      # ------------------------------------------------------------
      # Display connection information
      # ------------------------------------------------------------
      - name: Maintain Connection
        shell: bash
        run: |
          echo ""
          echo "================================"
          echo "          RDP ACCESS"
          echo "================================"
          echo "Address:  $TAILSCALE_IP"
          echo "Username: run"
          echo "Password: value stored in RUN_PASSWORD secret"
          echo "================================"
          echo ""

          while true; do
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Runner active"
            sleep 300
          done
