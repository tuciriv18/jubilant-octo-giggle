name: Linux Build

on:
  workflow_dispatch:

jobs:
  secure-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install Cinnamon Desktop and XRDP
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            cinnamon-desktop-environment \
            xrdp \
            xorgxrdp \
            dbus-x11

      - name: Create User with added Secret Password
        env:
          RUN_PASSWORD: ${{ secrets.RUN_PASSWORD }}
        run: |
          if [ -z "$RUN_PASSWORD" ]; then
            echo "::error::RUN_PASSWORD secret is not set."
            exit 1
          fi

          sudo useradd -m -s /bin/bash run
          echo "run:$RUN_PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo run

      - name: Configure Cinnamon XRDP Session and Firewall
        run: |
          # Cinnamon session for the run user
          sudo tee /home/run/.xsession > /dev/null <<'EOF'
          cinnamon-session-cinnamon2d
          EOF

          sudo chown run:run /home/run/.xsession
          sudo chmod 644 /home/run/.xsession

          # Configure XRDP startup
          sudo cp /etc/xrdp/startwm.sh /etc/xrdp/startwm.sh.backup

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_CURRENT_DESKTOP=X-Cinnamon
          export XDG_SESSION_DESKTOP=cinnamon
          export XDG_CONFIG_DIRS=/etc/xdg/xdg-cinnamon:/etc/xdg/xdg-x-cinnamon:/etc/xdg:$XDG_CONFIG_DIRS

          exec cinnamon-session-cinnamon2d
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          sudo adduser xrdp ssl-cert

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          # RDP only through Tailscale
          sudo ufw allow from 100.64.0.0/10 to any port 3389 proto tcp
          sudo ufw --force enable

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          hostname: gh-runner-${{ github.run_id }}

      - name: Get Tailscale IP
        run: |
          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: Verify Accessibility
        run: |
          echo "Tailscale IP: $TAILSCALE_IP"

          if timeout 5 bash -c "cat < /dev/null > /dev/tcp/$TAILSCALE_IP/3389" 2>/dev/null; then
            echo "TCP connectivity successful!"
          else
            echo "::error::TCP connection to RDP port 3389 failed"
            exit 1
          fi

      - name: Maintain Connection
        run: |
          echo ""
          echo "=== ACCESS ==="
          echo "Address: $TAILSCALE_IP"
          echo "Username: run"
          echo "Password: (the one you set in RUN_PASSWORD)"
          echo "Desktop: Cinnamon"
          echo "=================="
          echo ""

          while true; do
            echo "[$(date)] Active"
            sleep 300
          done
