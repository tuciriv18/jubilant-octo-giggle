name: Linux Build

on:
  workflow_dispatch:

jobs:
  secure-build:
    runs-on: ubuntu-latest
    # GitHub-hosted runners hard-cap job execution at 6 hours.
    timeout-minutes: 360

    steps:
      - name: Install Desktop Environment and XRDP
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies xfce4-session xfce4-settings xfconf xrdp xorgxrdp xorg dbus dbus-x11 dbus-user-session

      - name: Create User with added Secret Password
        env:
          RUN_PASSWORD: ${{ secrets.RUN_PASSWORD }}
        run: |
          if [ -z "$RUN_PASSWORD" ]; then
            echo "::error::RUN_PASSWORD secret is not set. Add it under repo Settings > Secrets and variables > Actions."
            exit 1
          fi

          sudo useradd -m -s /bin/bash run
          echo "run:$RUN_PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo run

      - name: Configure XRDP Session and Firewall
        run: |
          # Exact session-start logic from the version that actually booted.
          # No dbus-launch wrapper: startxfce4 sets up D-Bus itself, but
          # only once DBUS_SESSION_BUS_ADDRESS / XDG_RUNTIME_DIR are cleared
          # first, in case xrdp's session left them set to something stale.
          sudo tee /home/run/.xsession > /dev/null <<'EOF'
          #!/bin/sh
          export XDG_CONFIG_DIRS=/etc:/etc/xdg
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_CACHE_HOME="$HOME/.cache"
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          exec /usr/bin/startxfce4
          EOF
          sudo chown run:run /home/run/.xsession
          sudo chmod +x /home/run/.xsession

          # Bypass /etc/X11/Xsession (Debian's own wrapper script) entirely
          # and go straight to .xsession with the environment pre-set —
          # this was the other half of what actually worked.
          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          export XDG_CONFIG_DIRS=/etc:/etc/xdg
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce
          if [ -r /etc/profile ]; then . /etc/profile; fi
          if [ -r "$HOME/.profile" ]; then . "$HOME/.profile"; fi
          export XDG_CONFIG_DIRS=/etc:/etc/xdg
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce
          exec "$HOME/.xsession"
          EOF
          sudo chmod 755 /etc/xrdp/startwm.sh

          # xrdp needs this to read the TLS cert it generates on install
          sudo adduser xrdp ssl-cert
          sudo systemctl enable --now xrdp

          # Scope RDP (port 3389, same as Windows) to Tailscale's CGNAT
          # range only. GitHub-hosted Ubuntu runners get a public IP too —
          # an unscoped rule would open 3389 to the whole internet, not
          # just your tailnet.
          sudo ufw allow from 100.64.0.0/10 to any port 3389 proto tcp
          sudo ufw --force enable

      # The official Tailscale action supports Linux runners directly —
      # unlike Windows, no manual API calls needed here. Reuses the same
      # TS_OAUTH_CLIENT_ID / TS_OAUTH_CLIENT_SECRET secrets from the
      # Windows workflow.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          hostname: gh-runner-${{ github.run_id }}

      - name: Get Tailscale IP
        run: |
          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: Verify Accessibility
        run: |
          echo "Tailscale IP: $TAILSCALE_IP"

          if timeout 5 bash -c "cat < /dev/null > /dev/tcp/$TAILSCALE_IP/3389" 2>/dev/null; then
            echo "TCP connectivity successful!"
          else
            echo "::error::TCP connection to RDP port 3389 failed"
            exit 1
          fi

      - name: Maintain Connection
        run: |
          echo ""
          echo "=== ACCESS ==="
          echo "Address: $TAILSCALE_IP"
          echo "Username: run"
          echo "Password: (the one you set in the RUN_PASSWORD secret)"
          echo "=================="
          echo ""

          # Keep runner active, and surface the two logs that actually show
          # what happens when a session start is attempted. Interval is
          # short (20s) on purpose right now so a log entry shows up soon
          # after you try connecting — put it back to something longer
          # once this is sorted out.
          while true; do
            echo ""
            echo "[$(date)] Active - Use Ctrl+C in workflow to terminate"
            echo "----- xrdp-sesman.log (tail) -----"
            sudo tail -n 30 /var/log/xrdp-sesman.log 2>/dev/null || true
            echo "----- .xsession-errors (tail) -----"
            sudo tail -n 30 /home/run/.xsession-errors 2>/dev/null || true
            sleep 20
          done
