name: macOS Remote Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-remote:
    runs-on: macos-15-intel
    timeout-minutes: 360

    steps:

      # ============================================================
      # SYSTEM INFORMATION
      # ============================================================
      - name: Show macOS Information
        run: |
          echo "=========================================="
          echo "          macOS RUNNER INFORMATION"
          echo "=========================================="

          sw_vers

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Hardware:"
          system_profiler SPHardwareDataType | head -40

          echo ""
          echo "Current user:"
          whoami

          echo ""
          echo "Logged-in users:"
          who

          echo "=========================================="


      # ============================================================
      # CREATE USER
      # ============================================================
      - name: Create Remote User
        env:
          RUN_PASSWORD: ${{ secrets.RUN_PASSWORD }}
        run: |

          if [ -z "$RUN_PASSWORD" ]; then
            echo "::error::RUN_PASSWORD secret is not configured."
            exit 1
          fi

          echo "Checking for user 'run'..."

          if id run >/dev/null 2>&1; then
            echo "User already exists."
          else
            echo "Creating user..."

            sudo sysadminctl \
              -addUser run \
              -fullName "Remote User" \
              -password "$RUN_PASSWORD"
          fi

          echo "Adding user to administrators..."

          sudo dseditgroup \
            -o edit \
            -a run \
            -t user \
            admin

          echo ""
          echo "User information:"
          id run

          echo ""
          echo "User creation complete."


      # ============================================================
      # PREPARE MACOS REMOTE MANAGEMENT
      # ============================================================
      - name: Configure macOS Remote Management
        env:
          RUN_PASSWORD: ${{ secrets.RUN_PASSWORD }}
        run: |

          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          echo "=========================================="
          echo "       REMOTE MANAGEMENT CONFIG"
          echo "=========================================="

          if [ ! -x "$KICKSTART" ]; then
            echo "::warning::Apple Remote Management kickstart utility was not found."
          else

            echo "kickstart found:"
            echo "$KICKSTART"

            echo ""
            echo "Attempting to activate Remote Management..."

            sudo "$KICKSTART" \
              -activate \
              -configure \
              -access -on \
              -users run \
              -privs -all \
              -restart \
              -agent || true

          fi

          echo ""
          echo "Checking ARDAgent..."

          sudo launchctl print system/com.apple.RemoteDesktop.agent \
            2>/dev/null || true

          echo ""
          echo "Checking port 5900..."

          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN \
            2>/dev/null || true


      # ============================================================
      # TAILSCALE
      # ============================================================
      #
      # IMPORTANT:
      # Your existing secret is:
      #
      #   TS_OAUTH_CLIENT_ID
      #   TS_OAUTH_CLIENT_SECRET
      #
      # ============================================================
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          version: latest


      # ============================================================
      # GET TAILSCALE IP
      # ============================================================
      - name: Get Tailscale IP
        run: |

          echo "Waiting for Tailscale..."

          sleep 5

          TS_IP=""

          for i in {1..10}; do

            TS_IP=$(tailscale ip -4 2>/dev/null || true)

            if [ -n "$TS_IP" ]; then
              break
            fi

            echo "Tailscale IP not available yet..."
            sleep 3

          done

          if [ -z "$TS_IP" ]; then
            echo "::error::Unable to obtain Tailscale IPv4 address."
            tailscale status || true
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "          TAILSCALE CONNECTED"
          echo "=========================================="
          echo "IP: $TS_IP"
          echo "=========================================="


      # ============================================================
      # CHECK TAILSCALE
      # ============================================================
      - name: Verify Tailscale
        run: |

          echo "===== TAILSCALE STATUS ====="

          tailscale status || true

          echo ""
          echo "===== TAILSCALE IP ====="

          tailscale ip -4 || true

          echo ""
          echo "===== TAILSCALE VERSION ====="

          tailscale version || true


      # ============================================================
      # CHECK MACOS REMOTE DESKTOP SERVICES
      # ============================================================
      - name: Diagnose Screen Sharing
        run: |

          echo ""
          echo "=========================================="
          echo "       SCREEN SHARING DIAGNOSTICS"
          echo "=========================================="

          echo ""
          echo "----- Port 5900 -----"

          sudo lsof -nP -iTCP:5900 \
            -sTCP:LISTEN || true

          echo ""
          echo "----- Port 3283 -----"

          sudo lsof -nP -iTCP:3283 \
            -sTCP:LISTEN || true

          echo ""
          echo "----- Remote Desktop processes -----"

          ps aux | grep -Ei \
            "ARDAgent|screensharing|remote.*desktop" \
            | grep -v grep || true

          echo ""
          echo "----- Remote Management launch services -----"

          sudo launchctl list \
            | grep -Ei \
            "Remote|Screen|ARD" \
            || true

          echo ""
          echo "----- Network interfaces -----"

          ifconfig | head -80

          echo ""
          echo "=========================================="


      # ============================================================
      # TEST LOCAL VNC
      # ============================================================
      - name: Test Local VNC
        run: |

          echo "Testing localhost:5900..."

          if nc -z -G 3 127.0.0.1 5900 2>/dev/null; then

            echo ""
            echo "=========================================="
            echo "       VNC PORT IS LISTENING"
            echo "=========================================="

          else

            echo ""
            echo "::warning::Nothing is listening on TCP 5900."

            echo ""
            echo "This means macOS Screen Sharing is not"
            echo "currently exposing a VNC server."

          fi


      # ============================================================
      # TEST TAILSCALE VNC
      # ============================================================
      - name: Test Tailscale VNC
        run: |

          echo "Testing:"
          echo "$TAILSCALE_IP:5900"

          if nc -z -G 5 "$TAILSCALE_IP" 5900 2>/dev/null; then

            echo ""
            echo "=========================================="
            echo "       TAILSCALE VNC PORT OPEN"
            echo "=========================================="

          else

            echo ""
            echo "::warning::TCP 5900 is not reachable through Tailscale."

          fi


      # ============================================================
      # DISPLAY ACCESS INFORMATION
      # ============================================================
      - name: Show Access Information
        run: |

          echo ""
          echo ""
          echo "================================================"
          echo "             MACOS RUNNER ACCESS"
          echo "================================================"
          echo ""

          echo "macOS:"
          sw_vers -productVersion

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Tailscale IP:"
          echo "$TAILSCALE_IP"

          echo ""
          echo "VNC address:"
          echo "$TAILSCALE_IP:5900"

          echo ""
          echo "Username:"
          echo "run"

          echo ""
          echo "Password:"
          echo "RUN_PASSWORD secret"

          echo ""
          echo "================================================"
          echo ""

          echo "IMPORTANT:"
          echo "This workflow cannot bypass macOS privacy"
          echo "authorization for Screen Recording / control."
          echo ""

          echo "If TCP 5900 is listening, try your VNC client."
          echo "If TCP 5900 is NOT listening, Screen Sharing"
          echo "has not been enabled by the hosted runner."
          echo ""

          echo "================================================"


      # ============================================================
      # KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep macOS Runner Alive
        run: |

          echo ""
          echo "=========================================="
          echo "       MACOS RUNNER IS ACTIVE"
          echo "=========================================="
          echo ""

          while true; do

            echo "[$(date)] macOS runner active."

            sleep 300

          done
