name: Remote macOS GUI Session

on:
  workflow_dispatch:

jobs:
  macos-gui:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Connect to Tailscale Network
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
          hostname: gh-runner-${{ github.run_id }}

      # Step 2: Create New User & Bypass TCC / Fix Black Screen
      - name: Setup New Admin User & TCC Permissions
        run: |
          # 1. Create new Admin user 'vncuser'
          sudo sysadminctl -addUser vncuser -fullName "VNC User" -password "SecretVNC123" -admin

          # 2. Configure VNC password via correct kickstart clientopts
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "SecretVNC123"

          # 3. Activate Remote Management service for 'vncuser'
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -users vncuser -privs -all \
            -restart -agent

          # 4. Inject TCC permissions using explicit column names (bypasses macOS 15 schema column mismatch)
          TCC_DB="/Library/Application Support/com.apple.TCC/TCC.db"
          sudo sqlite3 "$TCC_DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES ('kTCCServiceScreenCapture', 'com.apple.RemoteDesktopAgent', 0, 2, 4, 1);"
          sudo sqlite3 "$TCC_DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES ('kTCCServiceAccessibility', 'com.apple.RemoteDesktopAgent', 0, 2, 4, 1);"
          sudo sqlite3 "$TCC_DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES ('kTCCServiceScreenCapture', 'com.apple.screensharing.agent', 0, 2, 4, 1);"

          # 5. Set Auto-Login for 'vncuser' to activate GUI display session
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser "vncuser"

          # 6. Prevent screen sleep
          caffeinate -dimsu &

      # Step 3: Display Connection Info
      - name: Get Tailscale IP & Connection Info
        run: |
          TS_IP=$(tailscale ip -4)
          echo ""
          echo "========================================="
          echo " macOS VNC ACCESS INFO"
          echo " Address  : $TS_IP"
          echo " Port     : 5900"
          echo " Username : vncuser"
          echo " Password : SecretVNC123"
          echo "========================================="
          echo ""

      # Step 4: Keep Runner Alive
      - name: Keep Runner Alive for GUI Access
        run: |
          echo "Runner is waiting for VNC connection..."
          while true; do
            echo "[$(date)] Runner active - Connect via VNC to $(tailscale ip -4):5900"
            sleep 300
          done
